<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        table {
            background-color: lightgray;
            padding: 15px;
            border: 2px solid black;
            border-radius: 10px;
            margin: 50px auto;
        }

        #display {
            background-color: white;
            height: 80px;
            text-align: right;
            font-size: 30px;
            padding: 10px;
            border: 1px solid black;
        }

        button {
            width: 90px;
            height: 65px;
            font-size: 20px;
            cursor: pointer;
        }

        .clear {
            width: 185px;
        }
    </style>
</head>

<body>

    <h2>My Calculator</h2>

    <table>

        <tr>
            <td colspan="4" id="display">0</td>
        </tr>

        <tr>
            <td colspan="2">
                <button class="clear" onclick="clearDisplay()">CLEAR</button>
            </td>

            <td colspan="2">
                <button class="clear" onclick="deleteLast()">DELETE</button>
            </td>
        </tr>

        <tr>
            <td><button onclick="add('7')">7</button></td>
            <td><button onclick="add('8')">8</button></td>
            <td><button onclick="add('9')">9</button></td>
            <td><button onclick="add('/')">÷</button></td>
        </tr>

        <tr>
            <td><button onclick="add('4')">4</button></td>
            <td><button onclick="add('5')">5</button></td>
            <td><button onclick="add('6')">6</button></td>
            <td><button onclick="add('*')">×</button></td>
        </tr>

        <tr>
            <td><button onclick="add('1')">1</button></td>
            <td><button onclick="add('2')">2</button></td>
            <td><button onclick="add('3')">3</button></td>
            <td><button onclick="add('-')">-</button></td>
        </tr>

        <tr>
            <td><button onclick="add('.')">.</button></td>
            <td><button onclick="add('0')">0</button></td>
            <td><button onclick="calculate()">=</button></td>
            <td><button onclick="add('+')">+</button></td>
        </tr>

    </table>


    <script>

        let value = "";

        function add(num) {

            value = value + num;

            document.getElementById("display").innerText = value;

        }

        function clearDisplay() {

            value = "";

            document.getElementById("display").innerText = "0";

        }

        function deleteLast() {

            value = value.slice(0, -1);

            document.getElementById("display").innerText = value || "0";

        }

        function calculate() {

            try {

                value = eval(value);

                document.getElementById("display").innerText = value;

            }

            catch {

                value = "";

                document.getElementById("display").innerText = "Error";

            }

        }

    </script>

</body>

</html>
